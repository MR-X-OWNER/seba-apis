name: Build UI only

on:
  workflow_dispatch:

jobs:
  build-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build React
        run: |
          npm install
          npm run build

      - name: Zip build folder
        run: cd public && zip -qr ../ui-build.zip build

      - uses: actions/upload-artifact@v4
        with: { name: ui-build, path: ui-build.zip }
